<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 760" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Shri Gurukul Academy</title>
  <desc id="logoDesc">A yellow and red shield crest with a sunburst and Om symbol, labelled Shri Gurukul and the Sanskrit motto सा विद्या या विमुक्तये.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff34a"/>
      <stop offset="0.42" stop-color="#ffda00"/>
      <stop offset="1" stop-color="#f1ad00"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e32325"/>
      <stop offset="1" stop-color="#a60012"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#393534"/>
      <stop offset="0.5" stop-color="#171717"/>
      <stop offset="1" stop-color="#48413a"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#34200b" flood-opacity="0.25"/>
    </filter>
    <path id="shieldOuter" d="M300 22 C348 46 403 57 492 65 L539 69 C531 232 511 361 469 478 C429 588 365 681 300 731 C235 681 171 588 131 478 C89 361 69 232 61 69 L108 65 C197 57 252 46 300 22 Z"/>
    <path id="shieldInner" d="M300 43 C344 64 400 74 478 81 L516 84 C507 231 488 354 449 464 C412 568 355 648 300 694 C245 648 188 568 151 464 C112 354 93 231 84 84 L122 81 C200 74 256 64 300 43 Z"/>
  </defs>

  <!-- Shield and enamel -->
  <g filter="url(#shadow)">
    <use xlink:href="#shieldOuter" fill="url(#rim)" stroke="#111111" stroke-width="4"/>
    <use xlink:href="#shieldInner" fill="url(#gold)" stroke="#ffe977" stroke-width="4"/>
    <use xlink:href="#shieldInner" fill="none" stroke="#d28b00" stroke-width="2"/>
  </g>

  <!-- Traditional mark at the top -->
  <g fill="#c9141d" stroke="#c9141d" stroke-linecap="round">
    <path d="M263 92 v25 M277 92 v25 M323 92 v25 M337 92 v25" stroke-width="7"/>
    <circle cx="300" cy="104" r="7" stroke="none"/>
  </g>

  <!-- Sunburst behind the Om medallion -->
  <g transform="translate(300 389)" fill="#c81920" stroke="#c81920" stroke-linejoin="round">
    <circle r="151" fill="none" stroke="#e22a24" stroke-width="2" opacity="0.28"/>
    <g id="rays">
      <path d="M0,-170 L-7,-82 L7,-82 Z"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(10)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(20)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(30)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(40)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(50)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(60)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(70)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(80)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(90)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(100)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(110)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(120)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(130)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(140)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(150)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(160)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(170)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(180)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(190)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(200)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(210)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(220)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(230)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(240)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(250)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(260)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(270)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(280)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(290)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(300)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(310)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(320)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(330)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(340)"/>
      <path d="M0,-170 L-7,-82 L7,-82 Z" transform="rotate(350)"/>
    </g>
    <circle r="77" fill="url(#red)" stroke="#ffdc31" stroke-width="5"/>
    <circle r="67" fill="none" stroke="#ffd833" stroke-width="1.5"/>
    <text x="0" y="23" text-anchor="middle" fill="#ffdc32" stroke="none" font-family="Noto Sans Devanagari, sans-serif" font-size="78" font-weight="700">ॐ</text>
  </g>

  <!-- Main title banner -->
  <g filter="url(#shadow)">
    <path d="M82 190 L154 211 L142 269 L73 302 L97 241 Z" fill="#9d0010" stroke="#ffd432" stroke-width="3"/>
    <path d="M518 190 L446 211 L458 269 L527 302 L503 241 Z" fill="#9d0010" stroke="#ffd432" stroke-width="3"/>
    <path d="M105 163 Q300 94 495 163 L482 238 Q300 176 118 238 Z" fill="url(#red)" stroke="#ffd62d" stroke-width="4"/>
    <path d="M121 170 Q300 111 479 170" fill="none" stroke="#ffdc39" stroke-width="2"/>
    <path d="M122 228 Q300 170 478 228" fill="none" stroke="#ffdc39" stroke-width="2"/>
    <text x="300" y="197" text-anchor="middle" fill="#ffffff" stroke="#8b0010" stroke-width="0.6" paint-order="stroke" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="900" letter-spacing="1.2">SHRI GURUKUL</text>
  </g>

  <!-- Motto ribbon; exact requested Sanskrit tagline -->
  <g filter="url(#shadow)">
    <path d="M118 557 Q153 574 181 547 L419 547 Q447 574 482 557 L511 590 L467 603 L438 590 Q300 641 162 590 L133 603 L89 590 Z" fill="#a90013" stroke="#f8ca22" stroke-width="3.5"/>
    <path d="M155 542 Q300 581 445 542 L459 597 Q300 640 141 597 Z" fill="url(#red)" stroke="#ffdc32" stroke-width="4"/>
    <path d="M162 550 Q300 588 438 550" fill="none" stroke="#ffdc32" stroke-width="2"/>
    <text x="300" y="588" text-anchor="middle" fill="#ffffff" font-family="Noto Serif Devanagari, Noto Sans Devanagari, serif" font-size="25" font-weight="700" textLength="267" lengthAdjust="spacingAndGlyphs">सा विद्या या विमुक्तये</text>
  </g>

  <!-- Small lower ornament -->
  <path d="M273 647 Q300 662 327 647" fill="none" stroke="#d08e00" stroke-width="3" stroke-linecap="round"/>
  <circle cx="300" cy="658" r="4" fill="#c81920"/>
</svg>
